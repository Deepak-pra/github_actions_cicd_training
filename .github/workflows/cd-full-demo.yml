name: CD Full Demo

on:
  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/cd-full-demo.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve Latest Release for Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env_name: ${{ steps.r.outputs.env_name }}
      release_tag: ${{ steps.r.outputs.release_tag }}
    steps:
      - name: Find latest release for this environment
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          case "${{ github.ref_name }}" in
            dev)   ENV_NAME="dev" ;;
            stage) ENV_NAME="stage" ;;
            main)  ENV_NAME="prod" ;;
            *) echo "::error::Unsupported branch: ${{ github.ref_name }}"; exit 1 ;;
          esac

          echo "All releases visible to this workflow:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 30 | awk '{print $1}' || true
          echo "---"

          RELEASE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            | awk '{print $1}' \
            | grep -E "^node-app-.*-${ENV_NAME}-" \
            | head -n 1 || true)"

          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::No release found for environment '${ENV_NAME}'. Run the CI workflow (PR to ${{ github.ref_name }}) first so it publishes node-app-<version>-${ENV_NAME}-<sha>."
            exit 1
          fi

          echo "env_name=${ENV_NAME}"       >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Environment : ${ENV_NAME}"
          echo "Release tag : ${RELEASE_TAG}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## CD Target Resolved"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
  