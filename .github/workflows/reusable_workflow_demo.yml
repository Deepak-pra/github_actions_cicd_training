name: Reusable Workflow Demo

on:
  push:
    branches:
      - dev
      - stage
      - main
    paths:
      - "app/node/**"
      - ".github/workflows/reusable_workflow_demo.yml"
      - ".github/workflows/reusable-ci.yml"
      - ".github/workflows/reusable-cd.yml"

# These permissions are the maximum permissions available
# to the reusable workflows called from this workflow.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    secrets: inherit

  cd:
    name: CD
    needs: ci
    uses: ./.github/workflows/reusable-cd.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    secrets: inherit