sonar.test.inclusions=__tests__/**/*.test.js

sonar.exclusions=**/*ode_modules/**,**/dist/**,**/cover*ge/**,**/test-results/**,**/build-*can-package/**

sonar.coverage.exclusions=src/server.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
