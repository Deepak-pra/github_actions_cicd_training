name: CI Full Demo

on:
  pull_request:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/ci-full-demo.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Resolve Version and Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      env_name: ${{ steps.v.outputs.env_name }}
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - name: Compute version, env and tags
        id: v
        run: |
          case "${{ github.base_ref }}" in
            dev)   ENV_NAME="dev" ;;
            stage) ENV_NAME="stage" ;;
            main)  ENV_NAME="prod" ;;
            *) echo "::error::Unsupported base branch"; exit 1 ;;
          esac
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          IMAGE_TAG="${VERSION}-${ENV_NAME}"
          RELEASE_TAG="node-app-${ENV_NAME}"       # stable per-environment tag
          echo "env_name=${ENV_NAME}"       >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}"     >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo "## Build Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ steps.v.outputs.env_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.v.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | ${{ steps.v.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | ${{ steps.v.outputs.release_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target branch | ${{ github.base_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Summary
        if: always()
        working-directory: .
        run: echo "### Lint — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  unit-test:
    name: Unit Test
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Summary
        if: always()
        working-directory: .
        run: echo "### Unit Tests — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Integration Test
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - run: npm run test:integration
      - name: Summary
        if: always()
        working-directory: .
        run: echo "### Integration Tests — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: SonarQube Scan
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: app/node
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Summary
        if: always()
        run: echo "### SonarQube Scan — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Docker Image
    needs: [meta, lint, unit-test, integration-test, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build OCI image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: app/node
          file: app/node/Dockerfile
          load: true
          push: false
          provenance: false
          tags: node-app:${{ needs.meta.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=node-app
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Save image as tar + checksum
        id: save
        run: |
          docker save node-app:${{ needs.meta.outputs.image_tag }} -o node-app.tar
          sha256sum node-app.tar > SHA256SUMS.txt
          echo "size=$(du -h node-app.tar | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload image artifact (run-scoped)
        uses: actions/upload-artifact@v4
        with:
          name: node-app-${{ needs.meta.outputs.image_tag }}
          path: |
            node-app.tar
            SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          echo "## Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | node-app:${{ needs.meta.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | node-app.tar (${{ steps.save.outputs.size }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA256 | ${{ steps.save.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"

  trivy:
    name: Trivy Security Scan
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-${{ needs.meta.outputs.image_tag }}
      - name: Load image from tar
        run: |
          sha256sum -c SHA256SUMS.txt
          docker load -i node-app.tar
      - name: Trivy scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: node-app:${{ needs.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
      - name: Summary
        if: always()
        run: echo "## Trivy Scan — ${{ job.status }} (gate on CRITICAL)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Artifact to GitHub Release
    needs: [meta, build, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-${{ needs.meta.outputs.image_tag }}
      - name: Verify checksum before publishing
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish to the per-environment GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          ENV_NAME: ${{ needs.meta.outputs.env_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" node-app.tar SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" node-app.tar SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "node-app (${ENV_NAME}) ${VERSION}" \
              --notes "Latest node-app image artifact for ${ENV_NAME}. version=${VERSION}" \
              --prerelease
          fi
      - name: Summary
        if: always()
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | ${{ needs.meta.outputs.release_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ needs.meta.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ needs.meta.outputs.env_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assets | node-app.tar, SHA256SUMS.txt |" >> "$GITHUB_STEP_SUMMARY"