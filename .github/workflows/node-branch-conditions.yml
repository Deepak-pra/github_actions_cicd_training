name: Node CI - Complete Quality and Security Gates

on:
  pull_request:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"
      - ".gitignore"
  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Lint summary
        if: always()
        run: |
          echo "### Lint result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  security-sca:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - name: Run npm dependency audit
        run: npm audit --audit-level=high
      - name: Dependency audit summary
        if: always()
        run: |
          echo "### npm audit result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: SAST - CodeQL
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          TRACKED="$(git ls-files "app/node/coverage/**" "app/node/test-results/**" "app/node/dist/**" "app/node/build-scan-package/**")"
          if [[ -n "$TRACKED" ]]; then
            echo "$TRACKED"
            echo "::error title=Generated files committed::Coverage, test reports or build output must not be committed"
            exit 1
          fi
          echo "No generated output is tracked."
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript
          config: |
            name: Node CodeQL Configuration
            paths:
              - app/node/src
              - app/node/scripts
            paths-ignore:
              - app/node/coverage
              - app/node/test-results
              - app/node/dist
              - app/node/build-scan-package
              - app/node/node_modules
              - "**/*.min.js"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"

  unit-test:
    name: Complete Tests and Combined Coverage
    needs: [lint, security-sca]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app/node
    outputs:
      node_version: ${{ steps.metadata.outputs.node_version }}
      tested_sha: ${{ steps.metadata.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - name: Run complete test suite with combined coverage
        run: npm run test:coverage -- --coverageDirectory=coverage
      - name: Verify combined LCOV report
        run: |
          test -f coverage/lcov.info
          echo "::group::Files included in LCOV"
          grep "^SF:" coverage/lcov.info | sort | uniq
          echo "::endgroup::"
          grep -q "^SF:" coverage/lcov.info
      - name: Capture metadata
        id: metadata
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "tested_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage/
          retention-days: 7
          if-no-files-found: error

  integration-test:
    name: Integration Test Report
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - name: Run integration tests with JUnit XML
        run: npm run test:integration -- --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-results-${{ github.run_id }}
          path: app/node/test-results/
          retention-days: 7
          if-no-files-found: error

  sonar:
    name: SonarQube Analysis
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage
      - name: Verify SonarQube inputs and LCOV mappings
        shell: bash
        run: |
          test -f app/node/sonar-project.properties
          test -f app/node/coverage/lcov.info
          echo "::group::LCOV source records"
          grep "^SF:" app/node/coverage/lcov.info | sort | uniq
          echo "::endgroup::"
          grep -q "^SF:" app/node/coverage/lcov.info
      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: app/node

  build:
    name: Generate Web Artifact
    needs: [sonar, codeql]
    if: >-
      ${{ always() && needs.sonar.result == 'success' &&
          (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json
      - run: npm ci
      - name: Generate web artifact
        run: npm run build:web
        env:
          VERSION: ${{ github.run_number }}
          RELEASE_TAG: ci-${{ github.run_number }}
      - name: Verify generated artifact
        run: |
          test -f dist/web/index.html
          test -f dist/web/version.json
          test -f dist/web/health.json
          find dist/web -type f -print
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: app/node/dist/web/
          retention-days: 7
          if-no-files-found: error

  trivy-scan:
    name: Trivy Scan - Artifact and Dependencies
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact
      - name: Prepare inputs
        run: |
          mkdir -p security-input/artifact security-input/dependencies
          cp -R generated-artifact/. security-input/artifact/
          cp app/node/package.json app/node/package-lock.json security-input/dependencies/
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Vulnerability table
        run: |
          trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --format table --output trivy-vulnerability-table.txt --exit-code 0 security-input/dependencies
          cat trivy-vulnerability-table.txt
      - name: Vulnerability JSON
        run: trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --format json --output trivy-vulnerability-report.json --exit-code 0 security-input/dependencies
      - name: Secret JSON
        run: trivy fs --scanners secret --format json --output trivy-secret-report.json --exit-code 0 security-input/artifact
      - name: Count findings
        id: findings
        run: |
          VULNS=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' trivy-vulnerability-report.json)
          SECRETS=$(jq '[.Results[]? | .Secrets[]?] | length' trivy-secret-report.json)
          echo "vulns=$VULNS" >> "$GITHUB_OUTPUT"
          echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-reports-${{ github.run_id }}
          path: trivy-*.txt
          retention-days: 7
          if-no-files-found: error
      - name: Enforce gate
        if: ${{ steps.findings.outputs.vulns != '0' || steps.findings.outputs.secrets != '0' }}
        run: exit 1

  sbom:
    name: SBOM - Generated Web Artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: generated-artifact
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

  publish-artifacts:
    name: Publish CI Evidence Bundle
    needs: [lint, security-sca, codeql, unit-test, integration-test, sonar, build, trivy-scan, sbom]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all available artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          path: all-artifacts
      - name: Write complete status summary and manifest
        shell: bash
        run: |
          mkdir -p ci-evidence
          [[ -d all-artifacts ]] && cp -R all-artifacts/. ci-evidence/ || true
          status_icon() {
            case "$1" in
              success) printf '✅';; failure) printf '❌';;
              cancelled) printf '⛔';; skipped) printf '⏭️';;
              *) printf '❔';;
            esac
          }
          cat > ci-evidence/manifest.txt <<EOF
          Lint: ${{ needs.lint.result }}
          npm audit: ${{ needs.security-sca.result }}
          CodeQL: ${{ needs.codeql.result }}
          Complete tests and coverage: ${{ needs.unit-test.result }}
          Integration report: ${{ needs.integration-test.result }}
          SonarQube: ${{ needs.sonar.result }}
          Build: ${{ needs.build.result }}
          Trivy: ${{ needs.trivy-scan.result }}
          SBOM: ${{ needs.sbom.result }}
          EOF
          {
            echo "# Complete CI Status"
            echo "| Job | Status | Result |"
            echo "|---|---:|---|"
            echo "| Lint | $(status_icon '${{ needs.lint.result }}') | ${{ needs.lint.result }} |"
            echo "| npm Audit | $(status_icon '${{ needs.security-sca.result }}') | ${{ needs.security-sca.result }} |"
            echo "| CodeQL | $(status_icon '${{ needs.codeql.result }}') | ${{ needs.codeql.result }} |"
            echo "| Tests + Coverage | $(status_icon '${{ needs.unit-test.result }}') | ${{ needs.unit-test.result }} |"
            echo "| Integration Report | $(status_icon '${{ needs.integration-test.result }}') | ${{ needs.integration-test.result }} |"
            echo "| SonarQube | $(status_icon '${{ needs.sonar.result }}') | ${{ needs.sonar.result }} |"
            echo "| Build | $(status_icon '${{ needs.build.result }}') | ${{ needs.build.result }} |"
            echo "| Trivy | $(status_icon '${{ needs.trivy-scan.result }}') | ${{ needs.trivy-scan.result }} |"
            echo "| SBOM | $(status_icon '${{ needs.sbom.result }}') | ${{ needs.sbom.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce final gate
        if: >-
          ${{ needs.lint.result != 'success' || needs.security-sca.result != 'success' ||
              needs.unit-test.result != 'success' || needs.integration-test.result != 'success' ||
              needs.sonar.result != 'success' || needs.build.result != 'success' ||
              needs.trivy-scan.result != 'success' || needs.sbom.result != 'success' ||
              (needs.codeql.result != 'success' && needs.codeql.result != 'skipped') }}
        run: exit 1
