name: Demo3a - Cross-Workflow Producer (Release)
on:
  workflow_dispatch:
permissions:
  contents: write        # required to create a Release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Build the artifact
        run: |
          mkdir -p dist
          echo "release artifact, sha ${GITHUB_SHA:0:7}" > dist/app.txt
          (cd dist && zip -q app.zip app.txt)
      - name: Publish as a Release tagged by SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-1.0.0-${GITHUB_SHA:0:7}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" dist/app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "Cross-workflow demo build" --prerelease
          echo "Published release $TAG"
