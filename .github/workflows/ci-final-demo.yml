name: CI

on:
  pull_request:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/ci-final-demo.yml"

permissions:
  contents: write   # create/update the GitHub Release

jobs:
  build:
    name: Validate, Build, Scan and Publish Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve environment and release tag
        id: meta
        working-directory: .
        run: |
          case "${{ github.base_ref }}" in
            dev)   ENV_NAME="dev" ;;
            stage) ENV_NAME="stage" ;;
            main)  ENV_NAME="prod" ;;
          esac
          echo "env=${ENV_NAME}"        >> "$GITHUB_OUTPUT"
          echo "tag=node-app-${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "Environment: ${ENV_NAME}"
          echo "Release tag: node-app-${ENV_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: app/node
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: app/node
          load: true
          push: false
          tags: node-app:${{ steps.meta.outputs.env }}

      - name: Trivy scan the image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: node-app:${{ steps.meta.outputs.env }}
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Save image as artifact tar
        working-directory: .
        run: |
          docker save node-app:${{ steps.meta.outputs.env }} -o node-app.tar
          sha256sum node-app.tar > SHA256SUMS.txt
          ls -lh node-app.tar SHA256SUMS.txt

      - name: Publish artifact to the per-environment GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ENV_NAME: ${{ steps.meta.outputs.env }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" node-app.tar SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" node-app.tar SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "node-app (${ENV_NAME})" \
              --notes "Latest node-app image artifact for the ${ENV_NAME} environment" \
              --prerelease
          fi
          echo "Published artifact to release: $TAG"