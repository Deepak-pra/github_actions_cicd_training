name: Reusable CI

on:
  workflow_call:
    outputs:
      image_version:
        description: "Docker image version generated by CI"
        value: ${{ jobs.ci.outputs.image_version }}

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_version: ${{ steps.image.outputs.version }}

    defaults:
      run:
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Generate image name and version
        id: image
        shell: bash
        working-directory: .
        run: |
          IMAGE_VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/node-app"
          FULL_IMAGE="${IMAGE_REPOSITORY}:${IMAGE_VERSION}"

          echo "version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "repository=${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "full_image=${FULL_IMAGE}" >> "${GITHUB_OUTPUT}"

          echo "Image version: ${IMAGE_VERSION}"
          echo "Full image: ${FULL_IMAGE}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish versioned Docker image
        uses: docker/build-push-action@v7
        with:
          context: app/node
          file: app/node/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.full_image }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}

      - name: Display published image
        shell: bash
        working-directory: .
        run: |
          echo "Docker image published successfully:"
          echo "${{ steps.image.outputs.full_image }}"