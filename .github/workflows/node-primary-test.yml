name: Node Primary Test

on:
  push:
    branches:
      - dev
      - stage
      - main
    paths:
      - ".github/workflows/node-primary-test.yml"  

permissions:
  contents: read

jobs:
  unit-test:
    name: Primary Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Show primary workflow information
        run: |
          echo "Primary workflow started"
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Node version: $(node --version)"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit