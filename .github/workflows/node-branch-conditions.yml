name: Node CI - Complete Quality and Security Gates

on:
  pull_request:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"

  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ==========================================================
  # 1. LINT
  # ==========================================================
  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "::group::ESLint"

          npm run lint

          echo "::endgroup::"

      - name: Lint summary
        if: always()
        run: |
          echo "### Lint result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 2. NPM DEPENDENCY AUDIT
  # ==========================================================
  security-sca:
    name: npm Dependency Audit

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm dependency audit
        run: |
          echo "::group::npm dependency vulnerability scan"

          npm audit --audit-level=high

          echo "::endgroup::"

      - name: Dependency audit summary
        if: always()
        run: |
          {
            echo "## npm Dependency Audit"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Input | app/node/package-lock.json |"
            echo "| Failure threshold | HIGH and CRITICAL |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 3. CODEQL
  #
  # CodeQL is enabled only for public repositories.
  # ==========================================================
  codeql:
    name: SAST - CodeQL

    if: ${{ github.event.repository.private == false }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"

  # ==========================================================
  # 4. UNIT TESTS AND COVERAGE
  # ==========================================================
  unit-test:
    name: Unit Tests

    needs:
      - lint
      - security-sca

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    outputs:
      node_version: ${{ steps.test_metadata.outputs.node_version }}
      tested_sha: ${{ steps.test_metadata.outputs.tested_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          echo "::group::Jest unit tests"

          npm run test:unit -- \
            --coverage \
            --coverageDirectory=coverage

          echo "::endgroup::"

      - name: Capture test metadata
        id: test_metadata
        run: |
          echo "node_version=$(node --version)" \
            >> "$GITHUB_OUTPUT"

          echo "tested_sha=${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload unit-test coverage
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Unit-test summary
        if: always()
        run: |
          {
            echo "## Unit Tests"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Node | $(node --version) |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 5. INTEGRATION TESTS
  # ==========================================================
  integration-test:
    name: Integration Tests

    needs:
      - unit-test

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run integration tests with JUnit XML
        run: |
          echo "::group::Jest integration tests"

          npm run test:integration -- \
            --coverage \
            --reporters=default \
            --reporters=jest-junit

          echo "::endgroup::"
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml

      - name: Upload integration-test results
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-results-${{ github.run_id }}
          path: app/node/test-results/
          retention-days: 7
          if-no-files-found: error

      - name: Integration-test summary
        if: always()
        run: |
          echo "### Integration-test result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 6. SONARQUBE CLOUD
  # ==========================================================
  sonar:
    name: SonarQube Analysis

    needs:
      - unit-test
      - integration-test

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unit-test coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage

      - name: Verify SonarQube inputs
        shell: bash
        run: |
          echo "::group::SonarQube inputs"

          ls -la app/node/sonar-project.properties

          grep -E "^sonar\.(projectKey|organization)=" \
            app/node/sonar-project.properties

          ls -la app/node/coverage/lcov.info

          echo "::endgroup::"

          test -f app/node/sonar-project.properties
          test -f app/node/coverage/lcov.info

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: app/node

      - name: SonarQube summary
        if: always()
        run: |
          echo "### SonarQube result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 7. BUILD THE ACTUAL WEB ARTIFACT
  # ==========================================================
  build:
    name: Generate Web Artifact

    needs:
      - sonar
      - codeql

    if: >-
      ${{
        always() &&
        needs.sonar.result == 'success' &&
        (
          needs.codeql.result == 'success' ||
          needs.codeql.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate web artifact
        run: |
          echo "::group::Generate web artifact"

          npm run build:web

          echo "::endgroup::"
        env:
          VERSION: ${{ github.run_number }}
          RELEASE_TAG: ci-${{ github.run_number }}

      - name: Verify generated artifact
        run: |
          test -d dist/web
          test -f dist/web/index.html
          test -f dist/web/version.json
          test -f dist/web/health.json

          echo "::group::Generated artifact"

          find dist/web -type f -print

          echo "::endgroup::"

      - name: Upload generated artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: app/node/dist/web/
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Generated Web Artifact"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Artifact | web-dist-${{ github.run_id }} |"
            echo "| Source | app/node/dist/web |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 8. TRIVY
  #
  # Two Trivy assessments run:
  #
  # A. Vulnerability scan
  #    Input: package.json and package-lock.json
  #    Includes development dependencies because this training
  #    project currently contains only devDependencies.
  #
  # B. Secret scan
  #    Input: exact generated HTML and JSON artifact.
  # ==========================================================
  trivy-scan:
    name: Trivy Scan - Artifact and Dependencies

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download generated artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact

      - name: Prepare Trivy scan input
        id: scan_input
        shell: bash
        run: |
          test -f generated-artifact/index.html
          test -f generated-artifact/version.json
          test -f generated-artifact/health.json

          test -f app/node/package.json
          test -f app/node/package-lock.json

          rm -rf artifact-security-input

          mkdir -p artifact-security-input/artifact
          mkdir -p artifact-security-input/dependency-metadata

          cp -R generated-artifact/. \
            artifact-security-input/artifact/

          cp app/node/package.json \
            artifact-security-input/dependency-metadata/

          cp app/node/package-lock.json \
            artifact-security-input/dependency-metadata/

          ARTIFACT_FILE_COUNT=$(
            find artifact-security-input/artifact \
              -type f |
              wc -l
          )

          echo "artifact_file_count=$ARTIFACT_FILE_COUNT" \
            >> "$GITHUB_OUTPUT"

          echo "::group::Trivy scan input"

          find artifact-security-input -type f -print

          echo "::endgroup::"

      # setup-trivy v0.3.1 is the corrected release.
      # v0.3.0 is documented as broken by its publisher.
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      # ------------------------------------------------------
      # Dependency vulnerability table
      # ------------------------------------------------------
      - name: Scan dependencies for vulnerabilities - table
        shell: bash
        run: |
          trivy fs \
            --scanners vuln \
            --include-dev-deps \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-vulnerability-table.txt \
            --exit-code 0 \
            artifact-security-input/dependency-metadata

          echo "::group::Trivy vulnerability table"

          cat trivy-vulnerability-table.txt

          echo "::endgroup::"

      # JSON is also produced so the workflow can count
      # vulnerabilities and enforce the security gate.
      - name: Create vulnerability JSON report
        shell: bash
        run: |
          trivy fs \
            --scanners vuln \
            --include-dev-deps \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-vulnerability-report.json \
            --exit-code 0 \
            artifact-security-input/dependency-metadata

      # ------------------------------------------------------
      # Generated-artifact secret table
      # ------------------------------------------------------
      - name: Scan generated artifact for secrets - table
        shell: bash
        run: |
          trivy fs \
            --scanners secret \
            --format table \
            --output trivy-secret-table.txt \
            --exit-code 0 \
            artifact-security-input/artifact

          echo "::group::Trivy secret table"

          cat trivy-secret-table.txt

          echo "::endgroup::"

      - name: Create secret JSON report
        shell: bash
        run: |
          trivy fs \
            --scanners secret \
            --format json \
            --output trivy-secret-report.json \
            --exit-code 0 \
            artifact-security-input/artifact

      - name: Summarize Trivy results
        id: trivy_results
        shell: bash
        run: |
          test -f trivy-vulnerability-table.txt
          test -f trivy-vulnerability-report.json
          test -f trivy-secret-table.txt
          test -f trivy-secret-report.json

          VULNERABILITY_COUNT=$(
            jq '
              [
                .Results[]?
                | .Vulnerabilities[]?
              ]
              | length
            ' trivy-vulnerability-report.json
          )

          SECRET_COUNT=$(
            jq '
              [
                .Results[]?
                | .Secrets[]?
              ]
              | length
            ' trivy-secret-report.json
          )

          if ! [[ "$VULNERABILITY_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid vulnerability report::Unable to calculate the vulnerability count"
            exit 1
          fi

          if ! [[ "$SECRET_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid secret report::Unable to calculate the secret count"
            exit 1
          fi

          echo "vulnerability_count=$VULNERABILITY_COUNT" \
            >> "$GITHUB_OUTPUT"

          echo "secret_count=$SECRET_COUNT" \
            >> "$GITHUB_OUTPUT"

          {
            echo "## Trivy Security Scan"
            echo ""
            echo "| Check | Target | Findings |"
            echo "|---|---|---:|"
            echo "| HIGH/CRITICAL dependency vulnerabilities | package-lock.json, including dev dependencies | $VULNERABILITY_COUNT |"
            echo "| Exposed secrets | Generated web artifact | $SECRET_COUNT |"
            echo "| Generated artifact files | app/node/dist/web | ${{ steps.scan_input.outputs.artifact_file_count }} |"
            echo ""
            echo "The vulnerability table evaluates dependency metadata associated with the build."
            echo ""
            echo "The secret table evaluates the exact generated HTML and JSON artifact."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VULNERABILITY_COUNT" -eq 0 ]]; then
            echo "::notice title=Trivy vulnerability scan passed::No HIGH or CRITICAL dependency vulnerabilities were detected"
          else
            echo "::error title=Trivy vulnerabilities detected::$VULNERABILITY_COUNT HIGH or CRITICAL vulnerability finding(s) detected"
          fi

          if [[ "$SECRET_COUNT" -eq 0 ]]; then
            echo "::notice title=Trivy secret scan passed::No exposed secrets were detected in the generated artifact"
          else
            echo "::error title=Trivy secrets detected::$SECRET_COUNT exposed secret finding(s) detected"
          fi

      - name: Upload Trivy reports
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-reports-${{ github.run_id }}
          path: |
            trivy-vulnerability-table.txt
            trivy-vulnerability-report.json
            trivy-secret-table.txt
            trivy-secret-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail Trivy security gate
        if: >-
          ${{
            steps.trivy_results.outputs.vulnerability_count != '0' ||
            steps.trivy_results.outputs.secret_count != '0'
          }}

        shell: bash
        run: |
          echo "::error title=Trivy security gate failed::HIGH/CRITICAL vulnerabilities or exposed secrets were detected"

          exit 1

  # ==========================================================
  # 9. SBOM
  # ==========================================================
  sbom:
    name: SBOM - Generated Web Artifact

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Download generated artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: generated-artifact
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

      - name: SBOM summary
        if: always()
        run: |
          {
            echo "## Artifact SBOM"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Format | SPDX JSON |"
            echo "| Artifact | web-dist-${{ github.run_id }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 10. CI EVIDENCE BUNDLE
  # ==========================================================
  publish-artifacts:
    name: Publish CI Evidence Bundle

    needs:
      - unit-test
      - integration-test
      - sonar
      - build
      - trivy-scan
      - sbom
      - codeql

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Download all available artifacts
        continue-on-error: true

        uses: actions/download-artifact@v8.0.1
        with:
          path: all-artifacts

      - name: Create evidence manifest
        shell: bash
        run: |
          mkdir -p ci-evidence

          if [[ -d all-artifacts ]]; then
            cp -R all-artifacts/. ci-evidence/
          fi

          cat > ci-evidence/manifest.txt <<EOF_MANIFEST
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Run number: ${{ github.run_number }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Unit tests: ${{ needs.unit-test.result }}
          Integration tests: ${{ needs.integration-test.result }}
          SonarQube: ${{ needs.sonar.result }}
          CodeQL: ${{ needs.codeql.result }}
          Build: ${{ needs.build.result }}
          Trivy: ${{ needs.trivy-scan.result }}
          SBOM: ${{ needs.sbom.result }}
          EOF_MANIFEST

          echo "::group::CI evidence contents"

          find ci-evidence -maxdepth 6 -type f -print

          echo "::endgroup::"

      - name: Upload CI evidence bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Write final CI summary
        run: |
          {
            echo "# CI Pipeline Result"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit Tests | ${{ needs.unit-test.result }} |"
            echo "| Integration Tests | ${{ needs.integration-test.result }} |"
            echo "| SonarQube | ${{ needs.sonar.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Trivy | ${{ needs.trivy-scan.result }} |"
            echo "| SBOM | ${{ needs.sbom.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail final CI gate
        if: >-
          ${{
            needs.unit-test.result != 'success' ||
            needs.integration-test.result != 'success' ||
            needs.sonar.result != 'success' ||
            needs.build.result != 'success' ||
            needs.trivy-scan.result != 'success' ||
            needs.sbom.result != 'success' ||
            (
              needs.codeql.result != 'success' &&
              needs.codeql.result != 'skipped'
            )
          }}

        shell: bash
        run: |
          echo "::error title=CI gate failed::One or more required CI stages failed or were skipped"

          exit 1