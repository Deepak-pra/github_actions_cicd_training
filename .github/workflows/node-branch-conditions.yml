name: Node CI - Split Jobs

on:
  push:
    branches: [dev, stage, main]
    paths:
      - ".github/workflows/node-branch-conditions.yml"
      - "!.github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: node-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) LINT ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          echo "::group::ESLint"
          echo "::notice title=Lint::Running eslint on ${{ github.ref_name }}"
          npm run lint
          echo "::endgroup::"

  # ── 2) UNIT TESTS ──────────────────────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: app/node
    outputs:
      node_version: ${{ steps.meta.outputs.node_version }}
      tested_sha:   ${{ steps.meta.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          echo "::group::Jest unit tests"
          npm run test:unit -- --coverage --coverageDirectory=coverage
          echo "::endgroup::"

      - name: Capture job outputs
        id: meta
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "tested_sha=${{ github.sha }}"    >> "$GITHUB_OUTPUT"

      - name: Upload coverage (test results)
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: unit-coverage
          path: app/node/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ── 3) INTEGRATION TESTS ───────────────────────────────────
  integration-test:
    name: Integration Tests
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          echo "::group::Jest integration tests"
          npm run test:integration -- --reporters=default --reporters=jest-junit
          echo "::endgroup::"
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: integration-results
          path: app/node/test-results/
          retention-days: 2
          if-no-files-found: warn

  # ── 4) SONARQUBE ANALYSIS ──────────────────────────────────
  sonar:
    name: SonarQube Analysis
    needs: [unit-test, integration-test]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: app/nodeS
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0        

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate coverage for Sonar
        run: npm run test:unit -- --coverage --coverageDirectory=coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: app/node

  # ── 5) NODE BUILD ──────────────────────────────────────────
  build:
    name: Node Build
    needs: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "::group::Build"
          npm run build:web
          echo "::endgroup::"
        env:
          VERSION: ${{ github.run_number }}
          RELEASE_TAG: ci-${{ github.run_number }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: web-dist-${{ github.run_number }}
          path: app/node/dist/
          retention-days: 7
          if-no-files-found: error

  # ── 6) TRIVY SCAN ON THE BUILD ─────────────────────────────
  trivy-scan:
    name: Trivy Scan (Build)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: web-dist-${{ github.run_number }}
          path: build-to-scan

      - name: Trivy scan of the built artifact
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: build-to-scan            # scans the BUILD, not source
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy summary
        if: always()
        run: echo "### Trivy scanned build web-dist-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 7) COLLECT TEST RESULTS + BUILD ARTIFACTS ──────────────
  publish-artifacts:
    name: Publish Artifacts
    needs: [unit-test, integration-test, build, trivy-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: all-artifacts

      - name: Repackage as a single bundle
        run: |
          mkdir -p ci-bundle
          cp -r all-artifacts/* ci-bundle/ || true
          ls -R ci-bundle

      - name: Upload combined CI bundle
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ci-bundle-${{ github.run_number }}
          path: ci-bundle/
          retention-days: 14
          if-no-files-found: warn

      - name: Final summary
        if: always()
        run: |
          {
            echo "# CI Bundle - ${{ github.ref_name }} (run ${{ github.run_number }})"
            echo "- Unit coverage"
            echo "- Integration results"
            echo "- Build artifact (web-dist)"
            echo "- Trivy scan passed on the build"
          } >> "$GITHUB_STEP_SUMMARY"