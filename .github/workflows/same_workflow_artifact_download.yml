name: Demo2b - Consumer (tries to download from workflow A)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Try to download the other workflow's artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: cross-demo-app
          path: dist/
      - name: This line is never reached
        run: cat dist/app.txt
