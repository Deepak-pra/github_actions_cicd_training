name: Nightly Test Demo

on:
  # GitHub Actions cron uses UTC.
  # 9:45 PM IST = 04:15 PM UTC.
  schedule:
    - cron: "15 16 * * *"

permissions:
  contents: read

jobs:
  nightly-test:
    name: Nightly Node Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Show trigger information
        run: |
          echo "Nightly test workflow started"
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled workflow branch: ${{ github.ref_name }}"
          echo "Application branch checked out: dev"
          echo "Run number: ${{ github.run_number }}"
          echo "Triggered at UTC: $(date -u)"
          echo "Scheduled time: 9:45 PM IST"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test