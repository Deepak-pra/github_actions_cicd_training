name: Composite CI Action

description: Validate the Node.js application, build a versioned Docker image, and publish it to Docker Hub

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true

  dockerhub_token:
    description: Docker Hub personal access token
    required: true

outputs:
  image_version:
    description: Docker image version generated by CI
    value: ${{ steps.image_details.outputs.image_version }}

  full_image:
    description: Complete Docker Hub image reference
    value: ${{ steps.image_details.outputs.full_image }}

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: app/node/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: app/node
      run: npm ci

    - name: Run lint
      shell: bash
      working-directory: app/node
      run: npm run lint

    - name: Run unit tests
      shell: bash
      working-directory: app/node
      run: npm run test:unit

    - name: Run integration tests
      shell: bash
      working-directory: app/node
      run: npm run test:integration

    - name: Generate image name and version
      id: image_details
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
      run: |
        set -euo pipefail

        LOWERCASE_USERNAME="${DOCKERHUB_USERNAME,,}"
        IMAGE_VERSION="v1.0.${GITHUB_RUN_NUMBER}"
        FULL_IMAGE="${LOWERCASE_USERNAME}/node-app:${IMAGE_VERSION}"

        echo "image_version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "full_image=${FULL_IMAGE}" >> "${GITHUB_OUTPUT}"

        echo "Image version: ${IMAGE_VERSION}"
        echo "Full image: ${FULL_IMAGE}"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and publish versioned Docker image
      uses: docker/build-push-action@v6
      with:
        context: app/node
        file: app/node/Dockerfile
        push: true
        tags: ${{ steps.image_details.outputs.full_