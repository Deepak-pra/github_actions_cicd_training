name: Nightly Test Demo

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  nightly-test:
    name: Nightly Node Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Show trigger information
        run: |
          echo "Nightly test workflow started"
          echo "Event: ${{ github.event_name }}"
          echo "Workflow ref: ${{ github.ref }}"
          echo "Application branch checked out: dev"
          echo "Run number: ${{ github.run_number }}"
          echo "Triggered at UTC: $(date -u)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test