name: Node CI - Build and Scan Actual Artifact

on:
  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ==========================================================
  # 1. LINT
  # ==========================================================
  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "::group::ESLint"

          npm run lint

          echo "::endgroup::"

      - name: Lint summary
        if: always()
        run: |
          echo "### Lint result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 2. SOFTWARE COMPOSITION ANALYSIS
  # ==========================================================
  security-sca:
    name: Dependency Audit

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          echo "::group::npm audit"

          npm audit --audit-level=high

          echo "::endgroup::"

      - name: Dependency audit summary
        if: always()
        run: |
          echo "### npm audit result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 3. CODEQL SAST
  #
  # CodeQL runs only for a public repository.
  # It is skipped automatically for a private repository.
  # ==========================================================
  codeql:
    name: SAST - CodeQL

    if: ${{ github.event.repository.private == false }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"

  # ==========================================================
  # 4. UNIT TESTS AND COVERAGE
  # ==========================================================
  unit-test:
    name: Unit Tests

    needs:
      - lint
      - security-sca

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    outputs:
      node_version: ${{ steps.test_metadata.outputs.node_version }}
      tested_sha: ${{ steps.test_metadata.outputs.tested_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          echo "::group::Jest unit tests"

          npm run test:unit -- \
            --coverage \
            --coverageDirectory=coverage

          echo "::endgroup::"

      - name: Capture test metadata
        id: test_metadata
        run: |
          echo "node_version=$(node --version)" \
            >> "$GITHUB_OUTPUT"

          echo "tested_sha=${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload unit coverage
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Unit-test summary
        if: always()
        run: |
          {
            echo "## Unit Tests"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Node | $(node --version) |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 5. INTEGRATION TESTS AND JUNIT XML
  # ==========================================================
  integration-test:
    name: Integration Tests

    needs:
      - unit-test

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Safely expose branch context
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Running integration tests for branch $BRANCH_NAME"

      - name: Run integration tests with JUnit XML
        run: |
          echo "::group::Jest integration tests"

          npm run test:integration -- \
            --coverage \
            --reporters=default \
            --reporters=jest-junit

          echo "::endgroup::"
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml

      - name: Upload integration results
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-results-${{ github.run_id }}
          path: app/node/test-results/
          retention-days: 7
          if-no-files-found: error

      - name: Integration-test summary
        if: always()
        run: |
          echo "### Integration-test result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 6. SONARQUBE CLOUD ANALYSIS
  # ==========================================================
  sonar:
    name: SonarQube Analysis

    needs:
      - unit-test
      - integration-test

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unit-test coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage

      - name: Verify SonarQube inputs
        shell: bash
        run: |
          echo "::group::SonarQube input verification"

          echo "Project configuration:"
          ls -la app/node/sonar-project.properties

          echo "Project identification:"
          grep -E "^sonar\.(projectKey|organization)=" \
            app/node/sonar-project.properties

          echo "LCOV coverage:"
          ls -la app/node/coverage/lcov.info

          echo "::endgroup::"

          test -f app/node/sonar-project.properties
          test -f app/node/coverage/lcov.info

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: app/node

      - name: SonarQube summary
        if: always()
        shell: bash
        run: |
          echo "### SonarQube analysis result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 7. GENERATE THE ACTUAL WEB ARTIFACT
  #
  # dist/web does not need to exist in Git.
  # npm run build:web generates it during this job.
  # ==========================================================
  build:
    name: Generate Web Artifact

    needs:
      - sonar
      - codeql

    if: >-
      ${{
        always() &&
        needs.sonar.result == 'success' &&
        (
          needs.codeql.result == 'success' ||
          needs.codeql.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate dist web artifact
        run: |
          echo "::group::Generate web artifact"

          npm run build:web

          echo "::endgroup::"
        env:
          VERSION: ${{ github.run_number }}
          RELEASE_TAG: ci-${{ github.run_number }}

      - name: Verify generated artifact
        run: |
          test -d dist/web
          test -f dist/web/index.html
          test -f dist/web/version.json
          test -f dist/web/health.json

          echo "::group::Generated artifact contents"

          find dist/web -type f -print

          echo "::endgroup::"

      - name: Upload exact generated artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: app/node/dist/web/
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Generated Web Artifact"
            echo ""
            echo "- Artifact: web-dist-${{ github.run_id }}"
            echo "- Source directory: app/node/dist/web"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 8. TRIVY SCAN OF THE EXACT GENERATED ARTIFACT
  #
  # The static artifact contains HTML and JSON, not npm package
  # metadata. Therefore Trivy scans the deployable artifact for
  # accidentally embedded credentials and secrets.
  #
  # npm dependency vulnerabilities are covered by npm audit.
  # ==========================================================
  trivy-scan:
    name: Trivy Scan - Generated Web Artifact

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Download exact generated artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact

      - name: Show artifact being scanned
        shell: bash
        run: |
          echo "::group::Generated artifact"

          find generated-artifact -type f -print

          echo "::endgroup::"

          test -f generated-artifact/index.html
          test -f generated-artifact/version.json
          test -f generated-artifact/health.json

      # Trivy writes JSON first so the workflow can show an exact
      # finding count and enforce the security gate explicitly.
      - name: Scan generated artifact and write JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: generated-artifact
          scanners: secret
          format: json
          output: trivy-artifact-report.json
          exit-code: "0"
          skip-version-check: true

      - name: Display and summarize Trivy results
        id: trivy_results
        shell: bash
        run: |
          test -f trivy-artifact-report.json

          echo "::group::Complete Trivy JSON report"

          cat trivy-artifact-report.json

          echo "::endgroup::"

          SECRET_COUNT=$(
            jq '[.Results[]? | .Secrets[]?] | length' \
              trivy-artifact-report.json
          )

          FILE_COUNT=$(
            find generated-artifact -type f | wc -l
          )

          echo "secret_count=$SECRET_COUNT" \
            >> "$GITHUB_OUTPUT"

          echo "file_count=$FILE_COUNT" \
            >> "$GITHUB_OUTPUT"

          {
            echo "## Trivy Generated-Artifact Scan"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Artifact | web-dist-${{ github.run_id }} |"
            echo "| Files scanned | $FILE_COUNT |"
            echo "| Exposed secrets | $SECRET_COUNT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy JSON report
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-artifact-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail when Trivy finds exposed secrets
        if: ${{ steps.trivy_results.outputs.secret_count != '0' }}
        shell: bash
        run: |
          echo "::error title=Trivy gate failed::Exposed secrets were found in the generated web artifact"

          exit 1

  # ==========================================================
  # 9. SBOM OF THE SAME GENERATED ARTIFACT
  # ==========================================================
  sbom:
    name: SBOM - Generated Web Artifact

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Download generated artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: generated-artifact

      - name: Show SBOM input
        shell: bash
        run: |
          echo "::group::SBOM input"

          find generated-artifact -type f -print

          echo "::endgroup::"

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: generated-artifact
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

      - name: SBOM summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Artifact SBOM"
            echo ""
            echo "- Format: SPDX JSON"
            echo "- Artifact: web-dist-${{ github.run_id }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 10. FINAL CI EVIDENCE BUNDLE
  # ==========================================================
  publish-artifacts:
    name: Publish CI Evidence Bundle

    needs:
      - unit-test
      - integration-test
      - sonar
      - build
      - trivy-scan
      - sbom
      - codeql

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Download all available artifacts
        continue-on-error: true

        uses: actions/download-artifact@v8.0.1
        with:
          path: all-artifacts

      - name: Create evidence manifest
        shell: bash
        run: |
          mkdir -p ci-evidence

          if [[ -d all-artifacts ]]; then
            cp -R all-artifacts/. ci-evidence/
          fi

          cat > ci-evidence/manifest.txt <<EOF_MANIFEST
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Run number: ${{ github.run_number }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Unit tests: ${{ needs.unit-test.result }}
          Integration tests: ${{ needs.integration-test.result }}
          SonarQube: ${{ needs.sonar.result }}
          CodeQL: ${{ needs.codeql.result }}
          Build: ${{ needs.build.result }}
          Trivy artifact scan: ${{ needs.trivy-scan.result }}
          SBOM: ${{ needs.sbom.result }}
          EOF_MANIFEST

          echo "::group::CI evidence contents"

          find ci-evidence -maxdepth 5 -type f -print

          echo "::endgroup::"

      - name: Upload CI evidence bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Write final CI summary
        run: |
          {
            echo "# CI Pipeline Result"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit Tests | ${{ needs.unit-test.result }} |"
            echo "| Integration Tests | ${{ needs.integration-test.result }} |"
            echo "| SonarQube | ${{ needs.sonar.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Trivy Artifact Scan | ${{ needs.trivy-scan.result }} |"
            echo "| SBOM | ${{ needs.sbom.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail final gate when a required stage failed
        if: >-
          ${{
            needs.unit-test.result != 'success' ||
            needs.integration-test.result != 'success' ||
            needs.sonar.result != 'success' ||
            needs.build.result != 'success' ||
            needs.trivy-scan.result != 'success' ||
            needs.sbom.result != 'success' ||
            (
              needs.codeql.result != 'success' &&
              needs.codeql.result != 'skipped'
            )
          }}
        shell: bash
        run: |
          echo "::error title=CI gate failed::One or more required stages failed or were skipped"

          exit 1