name: CI

on:
  pull_request:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/ci-ghcr-demo.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/node

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image SHA (PR head commit)
        id: vars
        run: echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: app/node
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: app/node
          load: true
          push: false
          tags: node-app:${{ steps.vars.outputs.sha }}

      - name: Trivy scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: node-app:${{ steps.vars.outputs.sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Tag and push to GHCR by commit SHA
        run: |
          docker tag node-app:${{ steps.vars.outputs.sha }} ghcr.io/${{ github.repository_owner }}/node-app:${{ steps.vars.outputs.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/node-app:${{ steps.vars.outputs.sha }}
