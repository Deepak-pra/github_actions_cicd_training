name: Composite CI Action

description: Lint, test, build, and publish the Node.js Docker image to Docker Hub

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true

  dockerhub_token:
    description: Docker Hub access token
    required: true

outputs:
  image_version:
    description: Docker image version created by CI
    value: ${{ steps.image.outputs.version }}

  full_image:
    description: Full Docker Hub image reference
    value: ${{ steps.image.outputs.full_image }}

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: app/node/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: app/node
      run: npm ci

    - name: Run lint
      shell: bash
      working-directory: app/node
      run: npm run lint

    - name: Run unit tests
      shell: bash
      working-directory: app/node
      run: npm run test:unit

    - name: Run integration tests
      shell: bash
      working-directory: app/node
      run: npm run test:integration

    - name: Generate image name and version
      id: image
      shell: bash
      run: |
        DOCKERHUB_USERNAME="${{ inputs.dockerhub_username }}"
        DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME,,}"

        IMAGE_VERSION="v1.0.${GITHUB_RUN_NUMBER}"
        FULL_IMAGE="${DOCKERHUB_USERNAME}/node-app:${IMAGE_VERSION}"

        echo "version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "full_image=${FULL_IMAGE}" >> "${GITHUB_OUTPUT}"

        echo "Image version: ${IMAGE_VERSION}"
        echo "Full image: ${FULL_IMAGE}"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and publish Docker image
      uses: docker/build-push-action@v6
      with:
        context: app/node
        file: app/node/Dockerfile
        push: true
        tags: ${{ steps.image.outputs.full_image }}
        build-args: |
          APP_VERSION=${{ steps.