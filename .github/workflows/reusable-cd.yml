name: Reusable CD

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  cd:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/node-app:latest

      - name: Save image to a tar file
        run: docker save ghcr.io/${{ github.repository_owner }}/node-app:latest -o node-app.tar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload image to S3 bucket
        run: aws s3 cp node-app.tar s3://${{ vars.S3_BUCKET }}/node-app.tar
