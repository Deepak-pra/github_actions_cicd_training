name: Node CI - Split Jobs

on:
  push:
    branches:
      - dev
      - stage
      - main
    paths:
      # Include changes to this workflow file.
      - ".github/workflows/node-branch-conditions.yml"
      # Explicitly ignore changes to the existing demo workflow.
      - "!.github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: node-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) LINT ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Lint summary
        run: echo "### Lint passed on ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 2) UNIT TESTS  (runs only after lint passes) ───────────
  unit-test:
    name: Unit Tests
    needs:
      - lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/node
    outputs:
      node_version: ${{ steps.meta.outputs.node_version }}
      tested_sha:   ${{ steps.meta.outputs.tested_sha }}
      result:       ${{ steps.meta.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Capture job outputs ($GITHUB_OUTPUT)
        id: meta
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "tested_sha=${{ github.sha }}"    >> "$GITHUB_OUTPUT"
          echo "result=passed"                   >> "$GITHUB_OUTPUT"

      - name: Unit test summary
        run: |
          {
            echo "## Unit Tests - ${{ github.ref_name }}"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Node | $(node --version) |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Result | passed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3) INTEGRATION TESTS  (runs only after unit tests pass) ─
  integration-test:
    name: Integration Tests
    needs:
      - unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

      - name: Integration summary
        run: |
          echo "### Integration passed for ${{ needs.unit-test.outputs.tested_sha }} (Node ${{ needs.unit-test.outputs.node_version }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Dev gate
        if: ${{ github.ref_name == 'dev' }}
        run: echo "Development gate passed."

      - name: Stage gate
        if: ${{ github.ref_name == 'stage' }}
        run: echo "Stage gate passed."

      - name: Main gate
        if: ${{ github.ref_name == 'main' }}
        run: echo "Production gate passed."