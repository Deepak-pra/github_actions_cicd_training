name: CD Full Demo

on:
  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/cd-full-demo.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Download Artifact and Deploy to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: Resolve environment and release tag
        id: meta
        run: |
          case "${{ github.ref_name }}" in
            dev)   ENV_NAME="dev" ;;
            stage) ENV_NAME="stage" ;;
            main)  ENV_NAME="prod" ;;
            *) echo "::error::Unsupported branch"; exit 1 ;;
          esac
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=node-app-${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download artifact from the per-environment Release
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.meta.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "node-app.tar" \
            --pattern "SHA256SUMS.txt"
          sha256sum -c SHA256SUMS.txt
          echo "size=$(du -h node-app.tar | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to environment S3 bucket
        id: up
        run: |
          KEY="${{ steps.meta.outputs.release_tag }}.tar"
          aws s3 cp node-app.tar "s3://${{ vars.S3_BUCKET_NAME }}/${KEY}"
          aws s3api head-object --bucket "${{ vars.S3_BUCKET_NAME }}" --key "${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ steps.meta.outputs.env_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | ${{ steps.meta.outputs.release_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | node-app.tar (${{ steps.dl.outputs.size }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA256 | ${{ steps.dl.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auth | GitHub OIDC to AWS (no static keys) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 object | ${{ steps.up.outputs.key }} |" >> "$GITHUB_STEP_SUMMARY"