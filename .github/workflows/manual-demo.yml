name: Manual Node Demo

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Enter the Node.js version"
        required: true
        type: string
        default: "24"

      run_tests:
        description: "Do you want to run tests?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

permissions:
  contents: read

jobs:
  demo:
    name: Manual Node Workflow
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Set up selected Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Display selected inputs
        run: |
          echo "Selected branch: ${{ github.ref_name }}"
          echo "Selected Node.js version: ${{ inputs.node_version }}"
          echo "Run tests selected: ${{ inputs.run_tests }}"
          echo "Triggered by: ${{ github.actor }}"

          echo ""
          echo "Installed Node.js version:"
          node --version

          echo ""
          echo "Installed npm version:"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        if: ${{ inputs.run_tests == 'yes' }}
        run: npm run test:unit

      - name: Run integration tests
        if: ${{ inputs.run_tests == 'yes' }}
        run: npm run test:integration

      - name: Tests skipped
        if: ${{ inputs.run_tests == 'no' }}
        run: |
          echo "Test execution was skipped because run_tests was set to no."

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Manual Node Demo"
            echo ""
            echo "| Selection | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Node.js version | \`${{ inputs.node_version }}\` |"
            echo "| Run tests | \`${{ inputs.run_tests }}\` |"
            echo "| Triggered by | \`${{ github.actor }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"