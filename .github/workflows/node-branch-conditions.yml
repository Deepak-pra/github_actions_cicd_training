name: Node CI - Complete Free Quality Gates

on:
  push:
    branches: [dev, stage, main]
    paths:
      - "app/node/**"
      - ".github/workflows/node-branch-conditions.yml"
      - "!.github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ── 1) LINT ────────────────────────────────────────────────
  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "::group::ESLint"

          echo "::notice title=Lint::Running ESLint on ${{ github.ref_name }}"

          npm run lint

          echo "::endgroup::"

      - name: Lint summary
        if: always()
        run: |
          echo "### Lint result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 2) DEPENDENCY AUDIT / SCA ──────────────────────────────
  security-sca:
    name: Dependency Audit

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm dependency audit
        run: |
          echo "::group::npm audit"

          npm audit --audit-level=high

          echo "::endgroup::"

      - name: Dependency audit summary
        if: always()
        run: |
          echo "### npm audit result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 3) SAST: CODEQL ────────────────────────────────────────
  # Free for public repositories.
  # Automatically skipped for private repositories.
  codeql:
    name: SAST - CodeQL

    if: ${{ github.event.repository.private == false }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"

  # ── 4) UNIT TESTS ──────────────────────────────────────────
  unit-test:
    name: Unit Tests

    needs:
      - lint
      - security-sca

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    outputs:
      node_version: ${{ steps.test_metadata.outputs.node_version }}
      tested_sha: ${{ steps.test_metadata.outputs.tested_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          echo "::group::Jest unit tests"

          npm run test:unit -- \
            --coverage \
            --coverageDirectory=coverage

          echo "::endgroup::"

      - name: Capture test metadata
        id: test_metadata
        run: |
          echo "node_version=$(node --version)" \
            >> "$GITHUB_OUTPUT"

          echo "tested_sha=${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload unit-test coverage
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Unit-test summary
        if: always()
        run: |
          {
            echo "## Unit Tests"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Node | $(node --version) |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 5) INTEGRATION TESTS ───────────────────────────────────
  integration-test:
    name: Integration Tests

    needs:
      - unit-test

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Safely expose branch context
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Running integration tests for branch $BRANCH_NAME"

      - name: Run integration tests and create JUnit report
        run: |
          echo "::group::Jest integration tests"

          npm run test:integration -- \
            --coverage \
            --reporters=default \
            --reporters=jest-junit

          echo "::endgroup::"
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml

      - name: Upload integration-test results
        if: always()

        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-results-${{ github.run_id }}
          path: app/node/test-results/
          retention-days: 7
          if-no-files-found: error

      - name: Integration-test summary
        if: always()
        run: |
          echo "### Integration-test result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 6) SONARQUBE ANALYSIS ──────────────────────────────────
  sonar:
    name: SonarQube Analysis

    needs:
      - unit-test
      - integration-test

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unit-test coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: unit-coverage-${{ github.run_id }}
          path: app/node/coverage

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: app/node

      - name: SonarQube summary
        if: always()
        run: |
          echo "### SonarQube analysis result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 7) NODE BUILD ──────────────────────────────────────────
  build:
    name: Node Build

    needs:
      - sonar
      - codeql

    # CodeQL is skipped on private repositories.
    # Build accepts CodeQL success or an intentional skip.
    if: >-
      ${{
        always() &&
        needs.sonar.result == 'success' &&
        (
          needs.codeql.result == 'success' ||
          needs.codeql.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "::group::Node build"

          npm run build:web

          echo "::endgroup::"
        env:
          VERSION: ${{ github.run_number }}
          RELEASE_TAG: ci-${{ github.run_number }}

      # The deployable artifact remains separate.
      # Dependency metadata is added only to the scan package
      # so Trivy and Syft can identify dependency versions.
      - name: Prepare build scan package
        run: |
          rm -rf build-scan-package

          mkdir -p build-scan-package

          cp -R dist build-scan-package/dist
          cp package.json package-lock.json build-scan-package/

          find build-scan-package -maxdepth 3 -type f -print

      - name: Upload deployable build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: app/node/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build scan package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-scan-package-${{ github.run_id }}
          path: app/node/build-scan-package/
          retention-days: 7
          if-no-files-found: error

  # ── 8) TRIVY SCAN OF BUILT ARTIFACT ────────────────────────
  trivy-scan:
    name: Trivy Scan - Built Artifact

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Download build scan package
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-scan-package-${{ github.run_id }}
          path: build-to-scan

      - name: Scan built artifact with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: build-to-scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

      - name: Trivy summary
        if: always()
        run: |
          echo "### Trivy build scan result: ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 9) SBOM OF BUILT ARTIFACT ──────────────────────────────
  sbom:
    name: SBOM - Built Artifact

    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Download build scan package
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-scan-package-${{ github.run_id }}
          path: build-for-sbom

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: build-for-sbom
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

  # ── 10) FINAL CI EVIDENCE BUNDLE ───────────────────────────
  publish-artifacts:
    name: Publish CI Evidence Bundle

    needs:
      - unit-test
      - integration-test
      - sonar
      - build
      - trivy-scan
      - sbom
      - codeql

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # Early CI failures may mean that no artifacts exist.
      # The manifest and final status still need to be created.
      - name: Download all workflow artifacts
        continue-on-error: true

        uses: actions/download-artifact@v8.0.1
        with:
          path: all-artifacts

      - name: Create CI evidence manifest
        run: |
          mkdir -p ci-evidence

          if [[ -d "all-artifacts" ]]; then
            cp -R all-artifacts/. ci-evidence/
          fi

          cat > ci-evidence/manifest.txt <<EOF
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Run number: ${{ github.run_number }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Unit tests: ${{ needs.unit-test.result }}
          Integration tests: ${{ needs.integration-test.result }}
          SonarQube: ${{ needs.sonar.result }}
          CodeQL: ${{ needs.codeql.result }}
          Build: ${{ needs.build.result }}
          Trivy: ${{ needs.trivy-scan.result }}
          SBOM: ${{ needs.sbom.result }}
          EOF

          find ci-evidence -maxdepth 3 -type f -print

      - name: Upload combined CI evidence bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Write final CI summary
        run: |
          {
            echo "# CI Pipeline Result"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit Tests | ${{ needs.unit-test.result }} |"
            echo "| Integration Tests | ${{ needs.integration-test.result }} |"
            echo "| SonarQube | ${{ needs.sonar.result }} |"
            echo "| CodeQL (public only) | ${{ needs.codeql.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Trivy Build Scan | ${{ needs.trivy-scan.result }} |"
            echo "| SBOM | ${{ needs.sbom.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail final gate when a required CI stage failed
        if: >-
          ${{
            needs.unit-test.result != 'success' ||
            needs.integration-test.result != 'success' ||
            needs.sonar.result != 'success' ||
            needs.build.result != 'success' ||
            needs.trivy-scan.result != 'success' ||
            needs.sbom.result != 'success' ||
            (
              needs.codeql.result != 'success' &&
              needs.codeql.result != 'skipped'
            )
          }}

        run: |
          echo "::error title=CI Gate Failed::One or more required CI stages failed or were skipped"

          exit 1