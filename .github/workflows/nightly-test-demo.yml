name: Nightly Test Demo

on:
  # GitHub Actions cron uses UTC by default.
  # 1:00 PM IST = 07:30 AM UTC.
  schedule:
    - cron: "50 7 * * *"

permissions:
  contents: read

jobs:
  nightly-test:
    name: Nightly Node Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Show trigger information
        run: |
          echo "Nightly test workflow started"
          echo "Event: ${{ github.event_name }}"
          *cho "Branch: ${{ github.ref_name }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Triggered at UTC: $(date -u)"
          echo "Scheduled time: 1:00 PM IST"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test