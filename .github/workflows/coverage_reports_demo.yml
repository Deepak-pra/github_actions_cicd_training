name: Demo5 - Coverage, Test Reports & Logs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Run tests, produce coverage + report + logs
    runs-on: ubuntu-latest
    steps:
      - name: Generate a coverage report (simulated lcov)
        run: |
          mkdir -p coverage test-results
          cat > coverage/lcov.info <<'LCOV'
          TN:
          SF:src/utils.js
          DA:1,1
          DA:2,1
          DA:3,0
          LF:3
          LH:2
          end_of_record
          LCOV
          echo "Coverage generated: 2/3 lines (66%)"

      - name: Generate a JUnit test report
        run: |
          cat > test-results/junit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="utils" tests="3" failures="0" time="0.12">
            <testcase classname="utils" name="adds two numbers" time="0.03"/>
            <testcase classname="utils" name="subtracts correctly" time="0.02"/>
            <testcase classname="utils" name="handles zero" time="0.02"/>
          </testsuite>
          XML
          echo "Test report written to test-results/junit.xml"

      - name: Show results in the LOG (grouped)
        run: |
          echo "::group::Coverage summary"
          echo "Lines found : 3"
          echo "Lines hit   : 2"
          echo "Coverage    : 66%"
          echo "::endgroup::"
          echo "::group::Test results"
          echo "3 passed, 0 failed"
          echo "::endgroup::"
          echo "::warning title=Coverage::Coverage 66% is below the 80% target"

      - name: Write results to the Job Summary
        if: always()
        run: |
          {
            echo "## Test & Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Tests passed | 3 / 3 |"
            echo "| Coverage | 66% |"
            echo "| Commit | ${GITHUB_SHA:0:7} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 3
          if-no-files-found: error

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: error

  view:
    name: Downstream job views the SAME coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage (same name as upload)
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
      - name: Read the coverage file
        run: |
          echo "Coverage file received by the view job:"
          cat coverage/lcov.info
