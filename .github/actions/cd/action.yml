name: Composite CD Action

description: Pull a versioned image from Docker Hub and upload it to S3

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true

  dockerhub_token:
    description: Docker Hub access token
    required: true

  image_version:
    description: Exact Docker image version generated by CI
    required: true

  aws_role_arn:
    description: AWS IAM role ARN used for OIDC authentication
    required: true

  aws_region:
    description: AWS region
    required: true

  s3_bucket_name:
    description: Target S3 bucket
    required: true

runs:
  using: composite

  steps:
    - name: Generate image and artifact names
      id: image
      shell: bash
      run: |
        DOCKERHUB_USERNAME="${{ inputs.dockerhub_username }}"
        DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME,,}"

        FULL_IMAGE="${DOCKERHUB_USERNAME}/node-app:${{ inputs.image_version }}"
        ARTIFACT_NAME="node-app-${{ inputs.image_version }}.tar"

        echo "full_image=${FULL_IMAGE}" >> "${GITHUB_OUTPUT}"
        echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

        echo "Source image: ${FULL_IMAGE}"
        echo "Artifact name: ${ARTIFACT_NAME}"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Pull exact Docker image
      shell: bash
      run: |
        docker pull "${{ steps.image.outputs.full_image }}"

    - name: Save Docker image as a TAR file
      shell: bash
      run: |
        docker save \
          "${{ steps.image.outputs.full_image }}" \
          --output "${{ steps.image.outputs.artifact_name }}"

    - name: Authenticate to AWS using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Upload versioned image to S3
      shell: bash
      run: |
        aws s3 cp \
          "${{ steps.image.outputs.artifact_name }}" \
          "s3://${{ inputs.s3_bucket_name }}/${{ steps.image.outputs.artifact_name }}"

    - name: Verify uploaded artifact
      shell: bash
      run: |
        aws s3api head-object \
          --bucket "${{ inputs.s3_bucket_name }}" \
          --key "${{ steps.image.outputs.artifact_name }}"