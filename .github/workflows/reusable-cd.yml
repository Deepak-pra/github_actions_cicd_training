name: Reusable CD

on:
  workflow_call:
    inputs:
      environment:
        description: "Target deployment environment"
        type: string
        required: true

      image_version:
        description: "Exact Docker image version generated by CI"
        type: string
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  cd:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: ${{ inputs.environment }}

    steps:
      - name: Generate image and artifact names
        id: image
        shell: bash
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/node-app"
          FULL_IMAGE="${IMAGE_REPOSITORY}:${{ inputs.image_version }}"
          ARTIFACT_NAME="node-app-${{ inputs.image_version }}.tar"

          echo "full_image=${FULL_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          echo "Environment: ${{ inputs.environment }}"
          echo "Source image: ${FULL_IMAGE}"
          echo "Artifact name: ${ARTIFACT_NAME}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact versioned image from GHCR
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.full_image }}"

      - name: Save Docker image as versioned TAR file
        shell: bash
        run: |
          docker save \
            "${{ steps.image.outputs.full_image }}" \
            --output "${{ steps.image.outputs.artifact_name }}"

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-reusable-cd-${{ github.run_id }}

      - name: Upload versioned Docker image to S3
        shell: bash
        run: |
          aws s3 cp \
            "${{ steps.image.outputs.artifact_name }}" \
            "s3://${{ vars.S3_BUCKET_NAME }}/${{ steps.image.outputs.artifact_name }}"

      - name: Verify uploaded image in S3
        shell: bash
        run: |
          aws s3api head-object \
            --bucket "${{ vars.S3_BUCKET_NAME }}" \
            --key "${{ steps.image.outputs.artifact_name }}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## CD Deployment Summary"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Source image: ${{ steps.image.outputs.full_image }}"
            echo "- S3 bucket: ${{ vars.S3_BUCKET_NAME }}"
            echo "- Artifact: ${{ steps.image.outputs.artifact_name }}"
          } >> "${GITHUB_STEP_SUMMARY}"