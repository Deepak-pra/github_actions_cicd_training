name: Reusable CD

on:
  workflow_call:
    inputs:
      environment:
        description: "Target deployment environment"
        type: string
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  cd:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Create lowercase GHCR image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/node-app:latest"

          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Image: ${IMAGE_NAME}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.name }}"

      - name: Save Docker image as tar file
        shell: bash
        run: |
          docker save \
            "${{ steps.image.outputs.name }}" \
            --output node-app.tar

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Docker image to environment S3 bucket
        shell: bash
        run: |
          aws s3 cp \
            node-app.tar \
            "s3://${{ vars.S3_BUCKET_NAME }}/node-app.tar"