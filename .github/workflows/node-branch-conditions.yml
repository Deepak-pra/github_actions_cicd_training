name: Node CI - Split Jobs

on:
  push:
    branches: [dev, stage, main]
    paths:
      - ".github/workflows/node-branch-conditions.yml"
      - "!.github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: node-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) LINT ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Run lint
        run: |
          # ::group:: — collapsible log · ::notice:: — annotation
          echo "::group::ESLint"
          echo "::notice title=Lint::Running eslint on ${{ github.ref_name }}"
          npm break
          echo "::endgroup::"
        continue-on-error: false  

      - name: Lint summary
        run: echo "### Lint passed on ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 2) UNIT TESTS ──────────────────────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app/node
    outputs:
      node_version: ${{ steps.meta.outputs.node_version }}
      tested_sha:   ${{ steps.meta.outputs.tested_sha }}
      result:       ${{ steps.meta.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Debug context (::debug::)
        shell: sh
        run: |
          # Only visible when ACTIONS_STEP_DEBUG=true
          echo "::debug::Event=${{ github.event_name }} Branch=${{ github.ref_name }} SHA=${{ github.sha }}"

      - name: Install dependencies
        shell: sh
        run: npm ci

      - name: Mask a demo secret (::add-mask::)
        shell: sh
        run: |
          FAKE_TOKEN="super-secret-123"
          echo "::add-mask::$FAKE_TOKEN"
          echo "Token in logs is now: $FAKE_TOKEN"   # prints ***

      - name: Run unit tests
        shell: sh
        run: |
          echo "::group::Jest unit tests"
          npm run test:unit
          echo "::endgroup::"

      - name: Capture job outputs
        shell: sh
        id: meta
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "tested_sha=${{ github.sha }}"    >> "$GITHUB_OUTPUT"
          echo "result=passed"                   >> "$GITHUB_OUTPUT"

      - name: Warn on coverage (::warning::)
        shell: sh
        run: echo "::warning title=Coverage::Coverage is a demo warning - job stays green"

      - name: Unit test summary
        shell: sh
        run: |
          {
            echo "## Unit Tests - ${{ github.ref_name }}"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Node | $(node --version) |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Result | passed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3) INTEGRATION TESTS ───────────────────────────────────
  integration-test:
    name: Integration Tests
    needs: [ lint, unit-test ]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          echo "::group::Jest integration tests"
          npm run test:integration
          echo "::endgroup::"

      - name: Integration summary
        run: echo "### Integration passed for ${{ needs.unit-test.outputs.tested_sha }} (Node ${{ needs.unit-test.outputs.node_version }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Dev gate
        if: ${{ github.ref_name == 'dev' }}
        run: echo "Development gate passed."

      - name: Stage gate
        if: ${{ github.ref_name == 'stage' }}
        run: echo "Stage gate passed."

      - name: Main gate
        if: ${{ github.ref_name == 'main' }}
        run: echo "Production gate passed."