name: Nightly Test Demo

on:
  # GitHub Actions cron uses UTC.
  # 12:30 PM IST = 07:00 AM UTC.
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-test:
    name: Nightly Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions*setup-node@v4
        with:
          node-version: "24"
          ca*he: npm
          cache-dependency*path: app/node/package-lock.json

      - name: Show trigger informat*on
        run: |
          echo "*ightly test workflow started"
          echo "Event: ${{ github.event_name }}"
          echo "Run numbe*: ${{ github.run_number }}"
          echo "Triggered at UTC: $(date *u)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test