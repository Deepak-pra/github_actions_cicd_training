name: Demo3b - Cross-Workflow Consumer (Release)
on:
  workflow_run:
    workflows: ["Demo3a - Cross-Workflow Producer (Release)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "7-char short SHA of the release to download"
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          SRC_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT="${{ inputs.sha }}"
          else
            SHORT="${SRC_SHA:0:7}"
          fi
          echo "tag=app-1.0.0-${SHORT}" >> "$GITHUB_OUTPUT"
      - name: Download the SAME release by tag (different workflow!)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Downloading release $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir dist/
          echo "Got it in a DIFFERENT workflow:"
          find dist -type f -print
          unzip -p dist/app.zip app.txt
