name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Create lowercase GHCR image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/node-app:latest"

          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Image: ${IMAGE_NAME}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: app/node
          file: app/node/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}